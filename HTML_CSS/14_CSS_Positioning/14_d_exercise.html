<!DOCTYPE html>

<html>
  <head>
    <title>CSS Positioning Exercise 14.d</title>
  </head>

  <body>
    <div style="
        background-color: green;
        color: white;
        position: fixed;
        bottom: 0px;
        right: 0px;
        top: 0;
        padding-right: 10px;
      "
    >right sidebar</div>

    <div style="
        
        background-color: rgba(0, 0, 0, 0.8);
        position: fixed;
        top: 0px;
        right: 0px;
        bottom: 0px;
        left: 0px;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div style="
          background-color: white;
          padding: 15px 15px;
          border-radius: 5px;
          width: 400px;

          font-family: Arial, Helvetica, sans-serif;
        "
      >
        <p style="
          font-size: 24px;
          font-weight: bold;
          margin: 0px;
        "
            >Modal Title</p>
        <p>This is a modal</p>
        <button>Close</button>
      </div>
    </div>
  </body>
</html>
