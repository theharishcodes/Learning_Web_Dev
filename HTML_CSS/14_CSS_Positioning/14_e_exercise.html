<!Doctype html>

<html>
    <head>
        <title>CSS Positioning Exercise 14.e</title>
    </head>

    <body>
        <div
        style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 60px;

            border-bottom-width: 1px;
            border-bottom-style: solid;

            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            top: 0px;
            right: 0px;
            left: 0px;
            
        "
        >
            <div
            style="
                display: flex;
                align-items: center;
            "
            >
                <img src="04_Images_Tables_List/mars.jpg"
                style="
                    height: 40px;
                    width: 40px;
                    border-radius: 50%;
                "
                >
                <p
                style="
                    font-weight: bold;
                    margin-left: 10px;
                "
                >Oliver Cat</p>
            </div>
            <div>
                <button
                style="
                    color: white;
                    background-color: rgb(56, 114, 219);
                    border: none;
                    border-radius: 5px;
                    padding: 10px 15px;
                    font-weight: bold;
                    cursor: pointer;
                "
                >Add Friend</button>
                <button
                style="
                    background-color: rgb(227, 229, 234);
                    border: none;
                    border-radius: 5px;
                    padding: 10px 15px;
                    font-weight: bold;
                    cursor: pointer;
                    margin-left: 3px;
                "
                >Message</button>
            </div>
        </div>
    </body>
</html>
