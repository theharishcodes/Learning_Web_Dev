<!DOCTYPE html>

<html>
  <head>
    <title>Nested Layouts</title>
    <link rel="stylesheet" href="nested_layouts.css">
  </head>

  <body>
    <div class="video-info">
      <div>
        <!-- thumbnail image -->
         <img class="thumbnail-image" src="images/tiger-2535888_640.jpg">
      </div>
      <div>
        <div class="profile-picture">
          <!-- profile picture -->
          <img class="profile-picture-image" src="images/cat_03.jpeg">
        </div>
        <div class="video-details">
          <!-- video title -->
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
          <!-- video author -->
          <p class="video-author">
            Marques Brownlee
          </p>
          <!-- video stats -->
          <p class="video-stats">
            3.4M views &#183; 6 months ago
          </p>
        </div>
      </div>
    </div>

    <div class="exercise-10-a">
      <div class="cat-card">
        <div class="cat-image-block">
          <img class="cat-image" src="images/cat_01.webp">
        </div>
        <div class="cat-name-block">
          <p class="cat-name">
            Oliver
          </p>
        </div>
        <div class="profile-friends">
          <img class="cat-profile" src="images/cat_01.webp">
          <p class="no-of-mfriends">
            3 mutual friends
          </p>
        </div>
        <div class="addfriendbutton">
          <button class="add-friend">
            Add Friend
          </button>
        </div>
      </div>

      <div class="cat-card">
        <div class="cat-image-block">
          <img class="cat-image" src="images/cat_02.jpeg">
        </div>
        <div class="cat-name-block">
          <p class="cat-name">
            Mimi
          </p>
        </div>
        <div class="profile-friends">
          <img class="cat-profile" src="images/cat_02.jpeg">
          <p class="no-of-mfriends">
            4 mutual friends
          </p>
        </div>
        <div class="addfriendbutton">
          <button class="add-friend">
            Add Friend
          </button>
        </div>
      </div>

      <div class="cat-card">
        <div class="cat-image-block">
          <img class="cat-image" src="images/cat_03.jpeg">
        </div>
        <div class="cat-name-block">
          <p class="cat-name">
            Blacky
          </p>
        </div>
        <div class="profile-friends">
          <img class="cat-profile" src="images/cat_03.jpeg">
          <p class="no-of-mfriends">
            2 mutual friends
          </p>
        </div>
        <div class="addfriendbutton">
          <button class="add-friend">
            Add Friend
          </button>
        </div>
      </div>
    </div>
  </body>
  

</html>
