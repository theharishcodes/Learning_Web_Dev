<!DOCTYPE html>

<html>
  <head>
    <title>Display_properties</title>
    <link rel="stylesheet" href="display_property.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Exercises -->

    <p class="exercise">Exercise 8.a</p>
    <input class="name" type="text" placeholder="Name">
    <input class="email" type="text" placeholder="Email">

    <p class="exercise">Exercise 8.b</p>
    <p class="feedback">Thanks for chatting with our customer support. Would you like to take our quick survey?</p>
    <button class="yes">Yes</button>
    <button class="no">No</button>

    <p class="exercise">Exercise 8.c</p>
    <img class="google-logo" src="images/google_logo.png">
    <input class="google-search-bar" type="text" placeholder="Search Google or type a URL">

    <p class="exercise">Exercise 8.d</p>
    <input class="first-name" type="text" placeholder="First name">
    <input class="first-name" type="text" placeholder="Last name">
    <input class="email-sign-up" type="text" placeholder="Email">
    <button class="sign-up">
      Sign Up
    </button>
    
    <p class="exercise">Exercise 8.e</p>
    <p class="heading-request">
      Request a ride now
    </p>
    <input class="enter-location" type="text" placeholder="Enter pickup location">
    <input class="enter-location" type="text" placeholder="Enter destination">
    <button class="request-now">
      Request now
    </button>
    <button class="schedule-for-later">
      Schedule for later
    </button>

  </body>
</html>
