<!DOCTYPE html>

<html>
    <head>
        <title>CSS Positioning Absotute and Relative Exercise 15</title>
    </head>

    <body
        style="padding-bottom: 3000px;"
    >
        <div style="position: fixed; width: 320px; height: 180px; background-color: rgb(128, 128, 128); bottom: 10px; right: 10px;">
            <button style="position: absolute; background-color: black; color: white; font-weight: bold; border: none; border-radius: 50%; height: 20px; width: 20px; top: -8px; left: -8px; cursor: pointer;">&#215;</button>
            <div style="background-color: black; color: white; font-size: 14px; font-family: Arial, Helvetica, sans-serif; padding: 2px 5px; position: absolute; bottom: 5px; right: 5px;">0:29</div>
        </div>
        
        <div
            style="
                padding: 10px 10px;
                border-width: 1px;
                border-style: solid;

                display: inline-block;
                position: relative;

            "        
        >
            <img src="iron-grey-flatlay_30b8de6f-065b-4a25-8be1-b55890255182.webp"
                style="
                    width: 150px;
                "
            >
            <div
                style="
                    display: inline-block;
                    padding: 4px 8px;
                    position: absolute;
                    top: 15px;
                    right: 10px;

                    background-color: black;
                    color: white;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 11px;
                "
            >20% OFF</div>
            <div 
                style="
                    background-color: rgba(255, 255, 255, 0.5);

                    position: absolute;
                    bottom: 10px;
                    right: 10px;
                    left: 10px;
                    height: 60px;
                "
            > 
            </div>
            <div
                style="
                    position: absolute;
                    
                    bottom: 10px;
                    right: 10px;
                    left: 10px;
                    height: 60px;
                   display: flex;
                   align-items: center;
                   justify-content: center;
                    
                    
                "
            >
                <button
                    style="
                        background-color: white;
                        border-style: solid;
                        border-width: 1px;
                        border-color:grey;
                    "
                >
                    Add to Cart
                </button>
            </div>
             
        </div>
        
    </body>
</html>
