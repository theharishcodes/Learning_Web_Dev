<style>
    .subscribe-button{
        background-color: rgb(204, 0, 0);
        color: white;

        border: none;
        border-radius: 2px;

        margin-right: 12px;

        padding-top: 10px;
        padding-right: 16px;
        padding-bottom: 10px;
        padding-left: 16px;

        cursor: pointer;
        transition: opacity 0.15s;

        vertical-align: top;
    }

    .subscribe-button:hover{
        opacity: 0.7;
    }

    .subscribe-button:active{
        opacity: 0.4;
    }

    .join-button{
        background-color: white;
        color: rgb(6, 95, 212);

        border-width: 1px;
        border-color: rgb(6, 95, 212);
        border-style: solid;
        border-radius: 2px;

        margin-right: 10px;
        margin-left: 0px;

        padding-top: 9px;
        padding-right: 15px;
        padding-bottom: 9px;
        padding-left: 15px;

        cursor: pointer;
        transition: opacity 0.15s, background-color 0.15s, color 0.15s;
        
        vertical-align: top;
    }

    .join-button:hover{
        background-color: rgb(6, 95, 212);
        color: white;
    }

    .join-button:active{
        opacity: 0.7;
    }

    .tweet-button{
        background-color: rgb(29, 155, 240);
        color: white;

        font-weight: bold;
        font-size: 15px;

        border: none;
        border-radius: 18px;

        padding-top: 9px;
        padding-right: 16px;
        padding-bottom: 9px;
        padding-left: 16px;


        cursor: pointer;
        transition: box-shadow 0.15s;

        vertical-align: top;

    }

    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0,0,0,0.15); /* horizontal, vertical, blur, color*/
    }
</style>

<button class="subscribe-button">
    SUBSCRIBE
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
